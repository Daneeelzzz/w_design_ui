<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Himti Store</title>
  <link rel="stylesheet" href="../css/login.css"/>
  <style>
    .admin-link {
      margin-top: 15px;
      text-align: center;
    }
    .admin-link a {
      color: #555;
      text-decoration: none;
      font-size: 0.9em;
    }
    .admin-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Masuk</h1>
    <form id="loginForm">
      <!-- Menambahkan ID agar bisa dibaca oleh JavaScript -->
      <input type="email" id="email" placeholder="Email" required/>
      <input type="password" id="password" placeholder="Kata Sandi" required/>
      <button type="submit">Masuk</button>
    </form>
    <p>Belum punya akun? <a href="register.html">Daftar</a></p>
    
    <!-- Tambahan navigasi ke halaman admin -->
    <div class="admin-link">
      <a href="admin-login.html">Login sebagai Admin</a>
    </div>
  </div>

  <script>
    // Memodifikasi skrip login
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      // Mencegah form untuk refresh halaman
      e.preventDefault(); 

      // 1. Ambil nilai dari input form
      const userEmail = document.getElementById('email').value;
      
      // Untuk demo, kita akan menggunakan nama statis.
      // Jika ini halaman register, Anda bisa menambahkan input untuk nama.
      const userName = 'Daniel Situmorang'; 
      
      // 2. Buat objek data pengguna
      const userData = {
          name: userName,
          email: userEmail
      };
      
      // 3. Simpan data pengguna ke localStorage browser
      // Data ini akan tetap tersimpan bahkan setelah browser ditutup
      localStorage.setItem('loggedInUser', JSON.stringify(userData));

      // 4. Beri notifikasi dan arahkan ke halaman profil
      alert("Login berhasil! Anda akan diarahkan ke halaman profil.");
      // Pastikan path ke profile.html sudah benar
      window.location.href = "profile.html"; 
    });
  </script>
</body>
</html>
